server {
    listen 80;
    server_name finance-tracker.co.uk www.finance-tracker.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name finance-tracker.co.uk www.finance-tracker.co.uk;

    ssl_certificate /etc/letsencrypt/live/finance-tracker.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance-tracker.co.uk/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}